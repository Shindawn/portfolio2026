<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Rich Emerald Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3121" />
      <stop offset="50%" stop-color="#061c13" />
      <stop offset="100%" stop-color="#03100a" />
    </linearGradient>

    <!-- Radial Emerald Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d4eddf" />
    </linearGradient>

    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" fill="url(#bgGrad)" />
  <circle cx="250" cy="250" r="230" fill="url(#glow)" />

  <!-- Outer Decorative Ring -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="#22c55e" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="8 6" />
  <circle cx="250" cy="250" r="200" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Inner Subtle Hex / Shield Background -->
  <circle cx="250" cy="250" r="160" fill="#0d3524" fill-opacity="0.6" stroke="#22c55e" stroke-width="2" stroke-opacity="0.5" />

  <!-- Center "MC" Initials (Dr. Macon) -->
  <g filter="url(#subtleShadow)">
    <text
      x="250"
      y="285"
      font-family="'Instrument Serif', 'Times New Roman', Georgia, serif"
      font-size="160"
      font-weight="400"
      font-style="italic"
      letter-spacing="-0.04em"
      fill="url(#textGrad)"
      text-anchor="middle"
    >
      MC
    </text>
  </g>

  <!-- Bottom Academic Distinction Mini Badge -->
  <rect x="180" y="375" width="140" height="34" rx="17" fill="#04140c" stroke="#22c55e" stroke-width="1.2" stroke-opacity="0.6" />
  <text
    x="250"
    y="397"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="13"
    font-weight="700"
    letter-spacing="0.16em"
    fill="#86efac"
    text-anchor="middle"
  >
    DR. MACON
  </text>
</svg>
