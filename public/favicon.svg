<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b533b" />
      <stop offset="100%" stop-color="#061a11" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bbf7d0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Background Rounded Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#22c55e" stroke-width="1.8" stroke-opacity="0.45" />
  <!-- Accent Status Dot -->
  <circle cx="51" cy="14" r="3" fill="#22c55e" />
  <!-- Monogram Logo Letters -->
  <text
    x="32"
    y="40.5"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
    font-size="22"
    font-weight="900"
    letter-spacing="-0.04em"
    fill="url(#textGrad)"
    text-anchor="middle"
    filter="url(#shadow)"
  >LGC</text>
</svg>
