<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3121" />
      <stop offset="100%" stop-color="#04140c" />
    </linearGradient>
    
    <!-- Mascot Face Vibrant Emerald Gradient -->
    <linearGradient id="mascotBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <!-- Drop Shadow for High Pop -->
    <filter id="cuteShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.8" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Dark Emerald Container Badge -->
  <rect width="64" height="64" rx="18" fill="url(#bg)" stroke="#22c55e" stroke-width="2" stroke-opacity="0.5" />

  <g filter="url(#cuteShadow)">
    <!-- Cute Sprout Leaves on Top -->
    <path d="M32 13 C32 6, 39 6, 38 12 C35 13, 33 13, 32 13 Z" fill="#86efac" />
    <path d="M32 13 C32 7, 25 7, 26 12 C29 13, 31 13, 32 13 Z" fill="#4ade80" />

    <!-- Cute Chubby Mascot Face Body -->
    <rect x="9" y="13" width="46" height="42" rx="16" fill="url(#mascotBody)" />
    <rect x="9" y="13" width="46" height="42" rx="16" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Big Happy Curved Smiling Eyes ^ ^ (Bold & High Contrast) -->
    <path d="M18 28.5 Q23.5 21 29 28.5" fill="none" stroke="#052e16" stroke-width="3.8" stroke-linecap="round" />
    <path d="M35 28.5 Q40.5 21 46 28.5" fill="none" stroke="#052e16" stroke-width="3.8" stroke-linecap="round" />

    <!-- Sparkle Highlights -->
    <circle cx="20" cy="22" r="1.4" fill="#ffffff" />
    <circle cx="44" cy="22" r="1.4" fill="#ffffff" />

    <!-- Rosy Blush Cheeks -->
    <ellipse cx="16.5" cy="34.5" rx="4" ry="2.5" fill="#fb7185" />
    <ellipse cx="47.5" cy="34.5" rx="4" ry="2.5" fill="#fb7185" />

    <!-- Joyful Open Smile :D with Tongue -->
    <path d="M26 33.5 Q32 42.5 38 33.5 Z" fill="#052e16" />
    <path d="M28.5 37 Q32 41.5 35.5 37 Z" fill="#f43f5e" />

    <!-- Cute "LGC" Pill Badge on Bottom -->
    <rect x="20.5" y="44.5" width="23" height="7.5" rx="3.75" fill="#052e16" />
    <text x="32" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5" font-weight="900" fill="#86efac" text-anchor="middle" letter-spacing="0.08em">LGC</text>
  </g>
</svg>
